    font-size: 22px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #9ea4b8;

  }

  .header .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 3px;
    color: #5a5f72;
    margin-top: 6px;

  .axis-label {
    position: fixed;
    z-index: 5;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #2a2e3d;
    pointer-events: none;

  .axis-label.yin { right: 40px; top: 50%; transform: translateY(-50%) rotate(90deg); }
  .axis-label.vertical { top: 80px; left: 50%; transform: translateX(-50%); }
  .axis-label.compact { bottom: 30px; left: 50%; transform: translateX(-50%); }

  .type-label {

    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
    z-index: 4;

    font-family: 'DM Mono', monospace;
    font-weight: 300;
    font-size: 8px;
    letter-spacing: 1px;
    opacity: 0.5;
    display: block;
    margin-top: 2px;
  }

  .star {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 3;
    transition: all 0.3s ease;
  }

  .star::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .star:hover {
    transform: translate(-50%, -50%) scale(2.5);
    z-index: 20;
  }

  .star:hover::after {
    opacity: 1;
  }

  .star-tooltip {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    padding: 3px 10px;
    border-radius: 2px;
    z-index: 30;
  }

  .star:hover .star-tooltip {
    opacity: 1;
  }

  .legend {
    position: fixed;
    bottom: 50px;
    right: 40px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 1px;
    color: #4a4e5d;
    cursor: pointer;
    transition: color 0.2s;
  }

  .legend-item:hover { color: #8a8e9d; }

  .legend-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-header {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #2a2e3d;
    margin-bottom: 4px;
  }

  .stats {
    position: fixed;
    bottom: 50px;
    left: 40px;
    z-index: 10;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 300;
    color: #2a2e3d;
    letter-spacing: 1px;
  }

  svg.constellation-lines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;

  body.highlight-mode .constellation-lines line { opacity: 0.02 !important; }

  "Classic":            { x: 0.52, y: 0.35, color: "#c0c0c8", glow: "rgba(192,192,200,0.35)" },
  "Soft Classic":       { x: 0.62, y: 0.38, color: "#c4aec8", glow: "rgba(196,174,200,0.35)" },
  "Flamboyant Gamine":  { x: 0.22, y: 0.72, color: "#6ec4b0", glow: "rgba(110,196,176,0.35)" },
  "Gamine":             { x: 0.38, y: 0.70, color: "#78c89a", glow: "rgba(120,200,154,0.35)" },
  "Soft Gamine":        { x: 0.54, y: 0.74, color: "#9ac8a8", glow: "rgba(154,200,168,0.35)" },
  "Theatrical Romantic": { x: 0.74, y: 0.62, color: "#d4889c", glow: "rgba(212,136,156,0.35)" },
  "Romantic":           { x: 0.86, y: 0.72, color: "#d47088", glow: "rgba(212,112,136,0.35)" },
};

// Seeded random for consistent layouts
function seededRandom(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) {
    h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
  }
  return function() {
    h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
    h = Math.imul(h ^ (h >>> 13), 0x45d9f3b);
    h = (h ^ (h >>> 16)) >>> 0;
    return h / 4294967296;
  };
}

// Background star field
function drawStarField() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Deep space gradient
  const grad = ctx.createRadialGradient(
    canvas.width * 0.3, canvas.height * 0.4, 0,
    canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.8
  );
  grad.addColorStop(0, '#0c1024');
  grad.addColorStop(0.5, '#080c18');
  grad.addColorStop(1, '#04060c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle nebula patches
  const nebulae = [
    { x: 0.2, y: 0.3, r: 0.25, color: 'rgba(60,80,140,0.04)' },
    { x: 0.7, y: 0.6, r: 0.3, color: 'rgba(140,70,100,0.03)' },
    { x: 0.5, y: 0.5, r: 0.4, color: 'rgba(80,100,120,0.02)' },
  ];
  nebulae.forEach(n => {
    const ng = ctx.createRadialGradient(
      n.x * canvas.width, n.y * canvas.height, 0,
      n.x * canvas.width, n.y * canvas.height, n.r * canvas.width
    );
    ng.addColorStop(0, n.color);
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  });

  // Background stars (tiny, dim)
  const rng = seededRandom('starfield');
  for (let i = 0; i < 400; i++) {
    const x = rng() * canvas.width;
    const y = rng() * canvas.height;
    const size = rng() * 1.2 + 0.3;
    const alpha = rng() * 0.4 + 0.1;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,230,${alpha})`;
    ctx.fill();
  }
}

// Build the constellation
function buildConstellation() {
  const layer = document.getElementById('constellation-layer');
  const svg = document.getElementById('lines-svg');
  const legend = document.getElementById('legend');
  const W = window.innerWidth;
  const H = window.innerHeight;

  // Margins
  const mx = 120, my = 100;
  const usableW = W - mx * 2;
  const usableH = H - my * 2;

  // Group celebrities by type
  const groups = {};
  DATA.forEach(d => {
    if (!groups[d.kibbe_type]) groups[d.kibbe_type] = [];
    groups[d.kibbe_type].push(d.name);
  });

  const allStars = []; // {x, y, type, name}

  // Place each type
  Object.entries(TYPE_CONFIG).forEach(([type, cfg]) => {
    const members = groups[type] || [];
    const cx = mx + cfg.x * usableW;
    const cy = my + cfg.y * usableH;

    // Scatter radius scales with group size
    const scatterR = Math.min(Math.sqrt(members.length) * 14, 80);

    // Type label
    const label = document.createElement('div');
    label.className = 'type-label';
    label.style.left = (cx - 40) + 'px';
    label.style.top = (cy - scatterR - 24) + 'px';
    label.style.color = cfg.color;
    label.style.textShadow = `0 0 20px ${cfg.glow}`;
    label.innerHTML = `${type}<span class="type-count">${members.length}</span>`;
    layer.appendChild(label);

    // Place stars
    members.forEach((name, i) => {
      const rng = seededRandom(name + type);
      const angle = rng() * Math.PI * 2;
      const dist = Math.sqrt(rng()) * scatterR;
      const x = cx + Math.cos(angle) * dist;
      const y = cy + Math.sin(angle) * dist;

      const star = document.createElement('div');
      star.className = 'star';
      star.dataset.type = type;
      star.style.left = x + 'px';
      star.style.top = y + 'px';

      const brightness = 0.6 + rng() * 0.4;
      star.style.backgroundColor = cfg.color;
      star.style.opacity = brightness;
      star.style.boxShadow = `0 0 ${4 + rng() * 6}px ${cfg.glow}`;
      star.style.setProperty('--glow', cfg.glow);

      // Tooltip
      const tooltip = document.createElement('div');
      tooltip.className = 'star-tooltip';
      tooltip.textContent = name;
      tooltip.style.color = cfg.color;
      tooltip.style.backgroundColor = 'rgba(6,8,15,0.9)';
      tooltip.style.border = `1px solid ${cfg.color}33`;
      star.appendChild(tooltip);

      layer.appendChild(star);
      allStars.push({ x, y, type, name });
    });
  });

  // Draw constellation lines (connect nearest neighbors within each type)
  const svgNS = "http://www.w3.org/2000/svg";
  Object.entries(TYPE_CONFIG).forEach(([type, cfg]) => {
    const stars = allStars.filter(s => s.type === type);
    if (stars.length < 2) return;

    // Minimum spanning tree for clean constellation lines
    const connected = new Set([0]);
    const edges = [];

    while (connected.size < stars.length) {
      let bestDist = Infinity;
      let bestFrom = -1, bestTo = -1;

      for (const from of connected) {
        for (let to = 0; to < stars.length; to++) {
          if (connected.has(to)) continue;
          const dx = stars[from].x - stars[to].x;
          const dy = stars[from].y - stars[to].y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestDist) {
            bestDist = d;
            bestFrom = from;
            bestTo = to;
          }
        }
      }

      if (bestTo === -1) break;
      connected.add(bestTo);
      edges.push([bestFrom, bestTo]);
    }

    edges.forEach(([a, b]) => {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', stars[a].x);
      line.setAttribute('y1', stars[a].y);
      line.setAttribute('x2', stars[b].x);
      line.setAttribute('y2', stars[b].y);
      line.setAttribute('stroke', cfg.color);
      line.setAttribute('stroke-width', '0.5');
      line.setAttribute('stroke-opacity', '0.12');
      line.dataset.type = type;
      svg.appendChild(line);
    });
  });

  // Legend
  const legendHeader = document.createElement('div');
  legendHeader.className = 'legend-header';
  legendHeader.textContent = 'Constellations';
  legend.appendChild(legendHeader);

  // Order: yang to yin
  const typeOrder = [
    "Dramatic", "Soft Dramatic",
    "Flamboyant Natural", "Natural", "Soft Natural",
    "Dramatic Classic", "Classic", "Soft Classic",
    "Flamboyant Gamine", "Gamine", "Soft Gamine",
    "Theatrical Romantic", "Romantic"
  ];

  typeOrder.forEach(type => {
    const cfg = TYPE_CONFIG[type];
    const count = (groups[type] || []).length;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="dot" style="background:${cfg.color};box-shadow:0 0 4px ${cfg.glow}"></span>${type} <span style="opacity:0.4">${count}</span>`;

    item.addEventListener('mouseenter', () => {
      document.body.classList.add('highlight-mode');
      document.querySelectorAll(`.star[data-type="${type}"]`).forEach(s => s.classList.add('highlighted'));
      document.querySelectorAll(`line[data-type="${type}"]`).forEach(l => l.classList.add('highlighted'));
    });

    item.addEventListener('mouseleave', () => {
      document.body.classList.remove('highlight-mode');
      document.querySelectorAll('.star.highlighted').forEach(s => s.classList.remove('highlighted'));
      document.querySelectorAll('line.highlighted').forEach(l => l.classList.remove('highlighted'));
    });

    legend.appendChild(item);
  });
}

// Twinkling animation
function twinkle() {
  const stars = document.querySelectorAll('.star');
  const now = Date.now();
  stars.forEach((star, i) => {
    const phase = (now * 0.001 + i * 0.7) % (Math.PI * 2);
    const flicker = 0.7 + Math.sin(phase) * 0.3;
    star.style.opacity = flicker;
  });
  requestAnimationFrame(twinkle);
}

// Init
window.addEventListener('load', () => {
  drawStarField();
  buildConstellation();
  twinkle();
});

window.addEventListener('resize', () => {
  const layer = document.getElementById('constellation-layer');
  const svg = document.getElementById('lines-svg');
  layer.innerHTML = '';
  svg.innerHTML = '';
  drawStarField();
  buildConstellation();
});
</script>
